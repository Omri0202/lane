[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-router"
version = "0.1.0"
description = "Language Agent Network Exchange — a local proxy that reads each prompt and sends it to the model that should answer it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omri Klainert" }]
keywords = ["llm", "router", "proxy", "openai", "anthropic", "gemini", "cost"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=1.0",
    "openai>=1.40",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lane = "lane.cli:main"

[project.urls]
Homepage = "https://github.com/Omri0202/lane"

[tool.setuptools.packages.find]
include = ["lane*"]

[tool.setuptools.package-data]
lane = ["models.json", "web/*.html"]
