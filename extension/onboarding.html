<!doctype html>
<html lang="en" data-lane>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.A.N.E. — set up</title>

<script src="ui.js"></script>

<style>
/* Five questions, one screen each, and a Skip on every one. An interview that
   feels like a form is one people abandon halfway, and a half-configured tool
   is worse than an unconfigured one because it gives confident wrong advice.

   Everything visual here comes from ui.js. What is left below is layout: how
   wide the column is, where the progress sits, how the footer stays put. */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--l-bg); color: var(--l-ink);
  font: 15px/1.6 var(--l-font);
  min-height: 100vh; display: flex; flex-direction: column;
}

header { padding: var(--l-5) var(--l-5) 0; }
.head { width: min(620px, 100%); margin: 0 auto;
        display: flex; align-items: center; gap: var(--l-3); }
.logo { display: flex; color: var(--l-accent); }
.logo svg { width: 16px; height: 16px; display: block; }
.dots { display: flex; gap: 5px; }
.dots i { width: 24px; height: 3px; border-radius: 2px; background: var(--l-line);
          transition: background .2s ease; }
.dots i.on { background: var(--l-accent); }
.count { margin-left: auto; }

main { flex: 1; display: flex; align-items: flex-start; justify-content: center;
       padding: var(--l-6) var(--l-5) var(--l-5); }
.card { width: min(620px, 100%); animation: l-rise .18s cubic-bezier(.2,.7,.3,1) both; }
h1 { margin: 0 0 6px; }
.sub { color: var(--l-dim); font-size: 14px; line-height: 1.55;
       margin: 0 0 var(--l-5); max-width: 54ch; }

/* A question's options. Same shape as .l-row, but these wrap real inputs, so
   they are a label rather than a button. */
.opts { display: flex; flex-direction: column; gap: var(--l-2); }
.opt {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 12px var(--l-4);
  border: 1px solid var(--l-line); border-radius: var(--l-r-md);
  background: var(--l-bg); cursor: pointer;
  transition: border-color .13s ease, background .13s ease, box-shadow .13s ease;
}
.opt:hover { border-color: var(--l-line-2); background: var(--l-sunk); }
/* A tint and a coloured edge, but not both a border and an inset ring: with
   every model ticked by default, the doubled emphasis turned the whole screen
   into one blue block and stopped reading as a state at all. */
.opt.on { border-color: var(--l-accent); background: var(--l-accent-soft); }
.opt input { margin: 4px 0 0; accent-color: var(--l-accent); flex: none; }
.opt .t { display: block; font-weight: 600; font-size: 14px; }
.opt .d { display: block; color: var(--l-dim); font-size: 12.5px; margin-top: 1px; }
.opt .p { margin-left: auto; color: var(--l-faint); font-size: 12px;
          white-space: nowrap; font-variant-numeric: tabular-nums;
          align-self: center; }

.group { margin-top: var(--l-5); }
.group .l-label { display: block; margin-bottom: var(--l-2); }

.star { margin-left: auto; align-self: center; }
.star.on { color: #e0a92e; }

footer { position: sticky; bottom: 0;
         background: linear-gradient(transparent, var(--l-bg) 30%);
         padding: var(--l-4) var(--l-5) var(--l-5); }
.bar { width: min(620px, 100%); margin: 0 auto;
       display: flex; gap: var(--l-2); align-items: center; }

.note { color: var(--l-faint); font-size: 12.5px; line-height: 1.55;
        margin-top: var(--l-4); max-width: 60ch; }
code { background: var(--l-sunk); padding: 1px 6px; border-radius: 5px;
       font: 12px var(--l-mono); }

.done { text-align: center; padding: var(--l-6) 0; }
.done .sub { margin-left: auto; margin-right: auto; }
.tick { display: inline-flex; width: 46px; height: 46px; margin-bottom: var(--l-3);
        align-items: center; justify-content: center; border-radius: 50%;
        background: var(--l-good); color: #fff; }
.tick svg { width: 24px; height: 24px; }
</style>
</head>
<body>

<header>
  <div class="head">
    <span class="logo" id="logo"></span>
    <span class="l-brand">LANE</span>
    <div class="dots" id="dots"></div>
    <span class="l-label count" id="count"></span>
  </div>
</header>

<main><div class="card" id="card"></div></main>

<footer><div class="bar">
  <button class="l-btn" id="back">Back</button>
  <button class="l-btn l-btn--primary" id="next">Continue</button>
  <span class="l-grow"></span>
  <button class="l-btn--link" id="skip" style="color:var(--l-dim)">Skip this</button>
</div></footer>

<script src="core/lane-core.js"></script>
<script src="profile.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
