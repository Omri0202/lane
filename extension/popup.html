<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>L.A.N.E.</title>
<style>
/* The launcher: what do you want to do, answered before you have opened
   anything. The panel can only help once somebody is already on a site and
   already typing; this catches the moment before that, which is when the
   choice of site and model is actually being made. */
:root {
  --bg:#fff; --panel:#f6f7f9; --line:#e3e6ea; --ink:#14171a;
  --dim:#6b7480; --faint:#99a1ac; --good:#1a8a5a; --alert:#c2410c;
  --accent:#3b6df5; --accent-ink:#fff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#171a1f; --panel:#1e222a; --line:#2b313a; --ink:#e8eaed;
          --dim:#9aa3ae; --faint:#6d7681; --good:#4ec98a; --alert:#fb923c;
          --accent:#5b87ff; --accent-ink:#0b0d10; }
}
* { box-sizing:border-box; }
body { width:360px; margin:0; background:var(--bg); color:var(--ink);
       font:13.5px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }

.top { display:flex; align-items:center; gap:8px; padding:9px 12px;
       background:var(--panel); border-bottom:1px solid var(--line); }
.brand { font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--faint); }
.grow { flex:1; }
.seg { display:flex; gap:2px; background:var(--bg); padding:2px;
       border:1px solid var(--line); border-radius:7px; }
.seg button { border:0; background:transparent; color:var(--dim); font:inherit;
              font-size:10px; font-weight:700; letter-spacing:.06em;
              padding:3px 9px; border-radius:5px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.gear { border:0; background:transparent; color:var(--faint); cursor:pointer;
        font-size:14px; padding:2px 4px; }
.gear:hover { color:var(--ink); }

.body { padding:12px; }
textarea { width:100%; min-height:62px; resize:vertical; font:inherit;
           padding:10px 11px; border:1px solid var(--line); border-radius:10px;
           background:var(--bg); color:var(--ink); }
textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }

.quick { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
.quick button { border:1px solid var(--line); background:var(--bg);
                color:var(--dim); border-radius:999px; padding:4px 11px;
                font:inherit; font-size:12px; cursor:pointer; }
.quick button:hover { border-color:var(--accent); color:var(--ink); }

.answer { margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
          display:none; }
.answer.show { display:block; }
.lead { display:flex; align-items:center; gap:7px; }
.tag { padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700;
       letter-spacing:.04em; text-transform:uppercase;
       background:#3b82f622; color:#3b6df5; }
@media (prefers-color-scheme: dark) { .tag { color:#7ba2ff; } }
.row { display:flex; align-items:baseline; gap:8px; margin-top:7px; }
.name { font-size:15px; font-weight:650; flex:1; }
.price { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.why { color:var(--dim); font-size:12px; margin-top:5px; }
.save { color:var(--good); font-size:12px; font-weight:600; margin-top:4px; }

.go { display:flex; gap:7px; margin-top:11px; }
.go button { flex:1; border:0; border-radius:9px; padding:9px;
             background:var(--accent); color:var(--accent-ink);
             font:inherit; font-weight:650; font-size:12.5px; cursor:pointer; }
.go button.alt { background:var(--panel); color:var(--ink);
                 border:1px solid var(--line); font-weight:500; }

.favs { margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
.favs h3 { font-size:9.5px; text-transform:uppercase; letter-spacing:.08em;
           color:var(--faint); margin:0 0 6px; font-weight:700; }
.favrow { display:flex; gap:6px; flex-wrap:wrap; }
.favrow button { border:1px solid var(--line); background:var(--bg);
                 color:var(--ink); border-radius:8px; padding:5px 10px;
                 font:inherit; font-size:12px; cursor:pointer; }
.favrow button:hover { border-color:var(--accent); }

.alert { margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
.alert .h { color:var(--alert); font-weight:700; font-size:11px;
            text-transform:uppercase; letter-spacing:.04em; }
.alert .l { display:flex; gap:6px; margin-top:5px; font-size:12.5px;
            align-items:baseline; }
.alert .l b { font-weight:650; }
.alert .l span { color:var(--dim); flex:1; }

.first { padding:22px 14px; text-align:center; }
.first p { color:var(--dim); margin:8px 0 14px; font-size:13px; }
</style>
</head>
<body>

<div class="top">
  <span class="brand">L.A.N.E.</span>
  <span class="grow"></span>
  <div class="seg" id="seg">
    <button data-v="save" aria-pressed="true">SAVE</button>
    <button data-v="best" aria-pressed="false">BEST</button>
  </div>
  <button class="gear" id="gear" title="Set up">⚙</button>
</div>

<div id="root"></div>

<script src="core/lane-core.js"></script>
<script src="profile.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money = (n) => n <= 0 ? "free"
  : n < 0.001 ? "$" + n.toFixed(5)
  : n < 0.01 ? "$" + n.toFixed(4)
  : n < 1 ? "$" + n.toFixed(3) : "$" + n.toFixed(2);

const SITE_URL = { claude:"https://claude.ai/new",
                   chatgpt:"https://chatgpt.com/",
                   gemini:"https://gemini.google.com/app" };
const SITE_NAME = { claude:"Claude", chatgpt:"ChatGPT", gemini:"Gemini" };
const PROVIDER_SITE = { anthropic:"claude", openai:"chatgpt", google:"gemini" };

// Shortcuts, ordered by what they told us they do. Not a substitute for typing
// — they are there for the times somebody knows the shape of the job but has
// not written the sentence yet.
const QUICK = {
  code:     ["debug this error", "write a function that", "review this code"],
  writing:  ["draft an email about", "summarise this", "rewrite this to be"],
  research: ["what is the latest on", "explain how", "look up"],
  images:   ["create a picture of", "make a logo for"],
};

let profile = null;
let variation = "save";
let current = null;

function openTab(url) {
  try {
    if (typeof chrome !== "undefined" && chrome.tabs) chrome.tabs.create({ url });
    else window.open(url, "_blank");
  } catch (e) { window.open(url, "_blank"); }
}

function openSetup() {
  const url = (typeof chrome !== "undefined" && chrome.runtime)
    ? chrome.runtime.getURL("onboarding.html") : "onboarding.html";
  openTab(url);
}

function render() {
  if (!profile.onboarded) {
    $("root").innerHTML = `
      <div class="first">
        <div style="font-size:15px;font-weight:650">Five quick questions.</div>
        <p>Which sites you use, which models you can pick, what you mostly do.
           Then every suggestion is about you rather than about models in
           general.</p>
        <div class="go"><button id="start">Set up</button></div>
      </div>`;
    $("start").addEventListener("click", openSetup);
    return;
  }

  const favs = LaneProfile.favourites(profile)
    .map((id) => LaneCore.MODELS.find((m) => m.id === id))
    .filter(Boolean);

  const quick = [];
  for (const f of (profile.focus.length ? profile.focus : Object.keys(QUICK))) {
    for (const q of (QUICK[f] || [])) if (quick.length < 5) quick.push(q);
  }

  $("root").innerHTML = `
    <div class="body">
      <textarea id="what" placeholder="What do you want to do?" autofocus></textarea>
      <div class="quick">${quick.map((q) =>
        `<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="answer" id="answer"></div>
      ${favs.length ? `<div class="favs">
        <h3>Your favourites</h3>
        <div class="favrow">${favs.map((m) =>
          `<button data-open="${esc(m.provider)}">${esc(m.display)}</button>`).join("")}</div>
      </div>` : ""}
    </div>`;

  const what = $("what");
  what.addEventListener("input", () => schedule(what.value));
  for (const b of document.querySelectorAll("[data-q]")) {
    b.addEventListener("click", () => {
      what.value = b.dataset.q + " ";
      what.focus();
      schedule(what.value);
    });
  }
  for (const b of document.querySelectorAll("[data-open]")) {
    b.addEventListener("click", () =>
      openTab(SITE_URL[PROVIDER_SITE[b.dataset.open]] || SITE_URL.claude));
  }
}

let timer = null;
function schedule(text) {
  clearTimeout(timer);
  timer = setTimeout(() => answer(text), 260);
}

function answer(text) {
  const box = $("answer");
  if (String(text || "").trim().split(/\s+/).filter(Boolean).length < 3) {
    box.classList.remove("show");
    return;
  }

  // Which site, chosen for THEM: only the ones they said they use, and only
  // ones whose models can actually do this.
  const sites = profile.sites.length ? profile.sites : Object.keys(SITE_URL);
  const allowed = LaneProfile.allowed(profile);

  let best = null;
  for (const site of sites) {
    const a = LaneCore.advise(text, site, variation, allowed);
    if (a.unavailable_here) continue;
    if (!best || a.recommend.cost < best.a.recommend.cost) best = { site, a };
  }

  if (!best) {
    // Nowhere they use can do it. Say where can.
    const any = LaneCore.advise(text, sites[0], variation, allowed);
    box.innerHTML = `
      <div class="lead"><span class="tag">${esc(any.lane_label)}</span></div>
      <div class="alert">
        <div class="h">None of your sites can do this</div>
        ${(any.elsewhere || []).slice(0, 3).map((e) => `
          <div class="l"><b>${esc(e.site)}</b><span>${esc(e.display)}</span>
            ${money(e.cost)}</div>`).join("")}
      </div>
      <div class="go">
        ${(any.elsewhere || []).slice(0, 1).map((e) =>
          `<button data-goto="${esc(PROVIDER_SITE[e.provider] || "claude")}">
             Open ${esc(e.site)}</button>`).join("")}
      </div>`;
    box.classList.add("show");
    wireGo();
    return;
  }

  current = best;
  const a = best.a;
  const rec = a.recommend;
  box.innerHTML = `
    <div class="lead">
      <span class="tag">${esc(a.lane_label)}</span>
      <span class="why" style="margin:0">on ${esc(SITE_NAME[best.site])}</span>
    </div>
    <div class="row">
      <span class="name">${esc(rec.display)}</span>
      <span class="price">${money(rec.cost)}</span>
    </div>
    ${a.is_top
      ? `<div class="why">Nothing lighter clears the bar for this.</div>`
      : `<div class="save">saves ${money(a.saving)} · ${a.factor}× cheaper than ${esc((a.top||{}).display)}</div>`}
    <div class="why">${esc(a.explain)}</div>
    <div class="go">
      <button data-goto="${esc(best.site)}">Open ${esc(SITE_NAME[best.site])}</button>
      <button class="alt" id="copy">Copy prompt</button>
    </div>`;
  box.classList.add("show");
  wireGo();

  const copy = $("copy");
  if (copy) copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("what").value); copy.textContent = "copied"; }
    catch (e) { copy.textContent = "could not copy"; }
  });
}

function wireGo() {
  for (const b of document.querySelectorAll("[data-goto]")) {
    b.addEventListener("click", () => openTab(SITE_URL[b.dataset.goto]));
  }
}

$("seg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  variation = b.dataset.v;
  for (const x of $("seg").children)
    x.setAttribute("aria-pressed", String(x.dataset.v === variation));
  LaneProfile.patch({ variation });
  const what = $("what");
  if (what && what.value.trim()) answer(what.value);
});

$("gear").addEventListener("click", openSetup);

LaneProfile.load().then((p) => {
  profile = p;
  variation = p.variation === "best" ? "best" : "save";
  for (const x of $("seg").children)
    x.setAttribute("aria-pressed", String(x.dataset.v === variation));
  render();
});
</script>
</body>
</html>
