<!doctype html>
<html lang="en" data-lane>
<head>
<meta charset="utf-8">
<title>L.A.N.E.</title>

<!-- The design system first, so the page-local rules below can lean on its
     tokens and override the handful of things a 360px popup needs. -->
<script src="ui.js"></script>

<style>
/* The launcher: what do you want to do, answered before you have opened
   anything. The panel can only help once somebody is already on a site and
   already typing; this catches the moment before that, which is when the
   choice of site and model is actually being made. */
* { box-sizing: border-box; }
body {
  width: 360px; margin: 0;
  background: var(--l-bg); color: var(--l-ink);
  font: 13px/1.55 var(--l-font);
}

/* The head is the shared one; it just needs to not round its corners here,
   because a popup has no card around it to round against. */
.l-head { border-radius: 0; }
.logo { display: flex; color: var(--l-accent); }
.logo svg { width: 15px; height: 15px; display: block; }

.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--l-2); }
.quick button {
  border: 1px solid var(--l-line); background: var(--l-bg);
  color: var(--l-dim); border-radius: 999px; padding: 4px 11px;
  font: inherit; font-size: 12px; cursor: pointer;
  transition: border-color .13s ease, color .13s ease;
}
.quick button:hover { border-color: var(--l-accent); color: var(--l-ink); }

textarea.l-field { min-height: 64px; resize: vertical; display: block; }

.answer { margin-top: var(--l-3); padding-top: var(--l-3);
          border-top: 1px solid var(--l-line); display: none; }
.answer.show { display: block; animation: l-rise .16s cubic-bezier(.2,.7,.3,1) both; }

.name { display: flex; align-items: baseline; gap: var(--l-2);
        margin-top: 7px; }
.why  { margin-top: 5px; }
.save { color: var(--l-good); font-size: 12px; font-weight: 600; margin-top: 4px; }

.go { display: flex; gap: 7px; margin-top: var(--l-3); }
.go .l-btn { flex: 1; }

.favs { margin-top: var(--l-3); padding-top: var(--l-3);
        border-top: 1px solid var(--l-line); }
.favrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.favrow .l-btn { padding: 5px 10px; font-size: 12px; }
.mark { display: inline-flex; width: 14px; height: 14px; flex: none; }
.mark svg { width: 100%; height: 100%; display: block; }

.gone { margin-top: var(--l-3); padding-top: var(--l-3);
        border-top: 1px solid var(--l-line); }
.gone .l { display: flex; gap: var(--l-2); margin-top: 5px; font-size: 12.5px;
           align-items: baseline; }
.gone .l b { font-weight: 620; }
.gone .l span { color: var(--l-dim); flex: 1; }

.first { padding: var(--l-6) var(--l-4) var(--l-5); text-align: center; }
.first p { color: var(--l-dim); margin: var(--l-2) 0 var(--l-4);
           font-size: 12.5px; line-height: 1.55; }
.first .mark { display: inline-flex; width: 34px; height: 34px;
               align-items: center; justify-content: center;
               border-radius: var(--l-r-md); background: var(--l-accent-soft);
               color: var(--l-accent); margin-bottom: var(--l-1); }
.first .mark svg { width: 19px; height: 19px; }

/* The one preference that used to be a one-way door: turning the search card
   off wrote a flag nothing could clear. It lives here now, where somebody
   who turned it off by accident can see that they did. */
.foot { display: flex; align-items: center; gap: var(--l-2);
        padding: 9px var(--l-3); border-top: 1px solid var(--l-line);
        background: var(--l-panel); }
</style>
</head>
<body>

<div class="l-head">
  <span class="logo" id="logo"></span>
  <span class="l-brand">LANE</span>
  <span class="l-grow"></span>
  <div class="l-seg" id="seg" role="group" aria-label="What to optimise for">
    <button data-v="save" aria-pressed="true"  title="Cheapest model that still does the job">SAVE</button>
    <button data-v="best" aria-pressed="false" title="Model whose strengths fit the request">BEST</button>
  </div>
  <button class="l-icon" id="gear" title="Set up" aria-label="Set up"></button>
</div>

<div id="root"></div>

<div class="foot" id="footPaid">
  <span class="l-sub l-grow">Models that cost extra</span>
  <div class="l-seg" id="paid" role="group" aria-label="Models that cost extra">
    <button data-paid="1" aria-pressed="false">SHOW</button>
    <button data-paid="0" aria-pressed="true">HIDE</button>
  </div>
</div>

<div class="foot" id="foot" hidden>
  <span class="l-sub l-grow">Suggestions while you search</span>
  <div class="l-seg" id="offers" role="group" aria-label="Offers on search engines">
    <button data-on="1" aria-pressed="true">ON</button>
    <button data-on="0" aria-pressed="false">OFF</button>
  </div>
</div>

<script src="core/lane-core.js"></script>
<script src="profile.js"></script>
<script src="popup.js"></script>
</body>
</html>
