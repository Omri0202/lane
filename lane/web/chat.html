<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.A.N.E.</title>
<style>
/* Everything is inline and self-hosted. The server this page ships with may be
   the only thing running, and a chat window that needs a CDN to render is a
   chat window that breaks on a train. */
:root {
  --bg: #ffffff; --panel: #f6f7f9; --line: #e3e6ea;
  --ink: #14171a; --dim: #6b7480; --faint: #99a1ac;
  --accent: #3b6df5; --accent-ink: #ffffff;
  --good: #1a8a5a; --warn: #a8710a;
  --bubble-you: #eef2fb;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101215; --panel: #171a1f; --line: #262b33;
    --ink: #e8eaed; --dim: #9aa3ae; --faint: #6d7681;
    --accent: #5b87ff; --accent-ink: #0b0d10;
    --good: #4ec98a; --warn: #e0b050;
    --bubble-you: #1c222e;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}

/* ── header ─────────────────────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--line); background: var(--panel);
  padding: 10px 16px; display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 650; letter-spacing: .08em; font-size: 13px; }
.modes { display: flex; gap: 2px; background: var(--bg);
         border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.modes button {
  border: 0; background: transparent; color: var(--dim); cursor: pointer;
  font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 7px;
}
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1 1 auto; }
.savings { font-size: 12.5px; color: var(--dim); text-align: right; line-height: 1.4; }
.savings b { color: var(--good); }
.ghost {
  border: 1px solid var(--line); background: var(--bg); color: var(--dim);
  border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px;
  cursor: pointer;
}
.ghost:hover { color: var(--ink); }

/* ── conversation ───────────────────────────────────────────────────────── */
main { flex: 1 1 auto; overflow-y: auto; }
.thread { max-width: 780px; margin: 0 auto; padding: 24px 16px 8px; }
.msg { margin-bottom: 22px; }
.msg .who { font-size: 11.5px; color: var(--faint); margin-bottom: 5px;
            letter-spacing: .04em; text-transform: uppercase; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you .bubble {
  background: var(--bubble-you); padding: 11px 14px;
  border-radius: var(--radius); display: inline-block; max-width: 100%;
}
.meta { margin-top: 7px; font-size: 12px; color: var(--faint);
        display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.lane-tag { padding: 1.5px 8px; border-radius: 999px; font-size: 11px;
            font-weight: 600; letter-spacing: .02em; }
.cost { font-variant-numeric: tabular-nums; }
.note { color: var(--warn); }
.err { color: #d6455a; }

/* Each lane gets its own colour so the routing is legible at a glance rather
   than something you have to read. */
.lane-trivial   { background: #8a919b22; color: var(--dim); }
.lane-simple    { background: #14b8a622; color: #0d9488; }
.lane-general   { background: #3b82f622; color: #3b6df5; }
.lane-longform  { background: #f59e0b22; color: #b4780a; }
.lane-reasoning { background: #8b5cf622; color: #7c4ddd; }
.lane-vision    { background: #06b6d422; color: #0891b2; }
.lane-tools     { background: #22c55e22; color: #15954c; }
@media (prefers-color-scheme: dark) {
  .lane-simple { color: #2dd4bf; } .lane-general { color: #7ba2ff; }
  .lane-longform { color: #e0b050; } .lane-reasoning { color: #a98bff; }
  .lane-vision { color: #22d3ee; } .lane-tools { color: #4ade80; }
}

/* ── composer ───────────────────────────────────────────────────────────── */
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
.composer { max-width: 780px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end; }
textarea {
  flex: 1 1 auto; resize: none; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 11px; padding: 11px 13px; max-height: 180px; min-height: 44px;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.send {
  background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 11px; padding: 12px 18px; font: inherit; font-weight: 600;
  cursor: pointer; height: 44px;
}
.send:disabled { opacity: .45; cursor: default; }
.hint { max-width: 780px; margin: 7px auto 0; font-size: 11.5px; color: var(--faint); }

.empty { text-align: center; color: var(--dim); padding: 56px 20px; }
.empty h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; color: var(--ink); }
.empty p { margin: 0 auto; max-width: 460px; font-size: 14px; }
.empty .routes { margin-top: 26px; font-size: 12.5px; display: inline-block; text-align: left; }
.empty .routes div { margin: 4px 0; }
.dots::after { content: "▍"; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <span class="brand">L.A.N.E.</span>
  <div class="modes" id="modes" role="group" aria-label="Routing mode">
    <button data-mode="save" aria-pressed="false">Save</button>
    <button data-mode="balanced" aria-pressed="true">Balanced</button>
    <button data-mode="performance" aria-pressed="false">Performance</button>
  </div>
  <span class="spacer"></span>
  <div class="savings" id="savings"></div>
  <button class="ghost" id="reset">New chat</button>
</header>

<main id="main">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h1>Ask anything.</h1>
      <p>Each message is read here on your machine and sent to whichever model
         suits it. Underneath every reply you will see which one answered, and
         what it cost.</p>
      <div class="routes" id="routes"></div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Send a message…"
              autofocus aria-label="Message"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("input"), sendBtn = $("send");

let mode = "balanced";
let history = [];          // the conversation, in OpenAI shape
let prices = {};           // model id -> {in, out, display}
let laneLabels = {};
let busy = false;

const money = n =>
  n === 0 ? "$0"
  : Math.abs(n) < 0.01 ? "$" + n.toFixed(4)
  : Math.abs(n) < 1 ? "$" + n.toFixed(3)
  : "$" + n.toFixed(2);

// ── boot ───────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const cat = await (await fetch("/lane/catalog")).json();
    laneLabels = cat.lanes || {};
    for (const m of cat.models || [])
      prices[m.id] = { in: m.in_price, out: m.out_price, display: m.display };
    if (cat.mode) setMode(cat.mode);

    if (!(cat.models || []).length) {
      $("empty").innerHTML =
        "<h1>No models available</h1><p>LANE has no API key it can use yet. " +
        "Run <code>lane keys set groq</code> in a terminal, then restart the " +
        "server and reload this page.</p>";
      input.disabled = sendBtn.disabled = true;
      return;
    }
    // Show where a few representative requests would actually go, so the
    // routing is concrete before the first message rather than a promise.
    const probes = [
      ["thanks!", "trivial"], ["capital of Peru", "simple"],
      ["why is my query slow", "reasoning"], ["draft an email", "longform"]
    ];
    const rows = await Promise.all(probes.map(async ([q]) => {
      const r = await fetch("/lane/route", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: [{ role: "user", content: q }] })
      }).then(r => r.json());
      const pick = (r.choices && r.choices[mode]) || {};
      return `<div><b>“${q}”</b> → ${pick.display || "?"}
              <span class="lane-tag lane-${r.classification.lane}">${
                laneLabels[r.classification.lane] || r.classification.lane
              }</span></div>`;
    }));
    $("routes").innerHTML = rows.join("");
  } catch (e) {
    $("empty").innerHTML = "<h1>Cannot reach LANE</h1><p>The server is not " +
      "responding. Is <code>lane serve</code> still running?</p>";
  }
  refreshSavings();
}

async function refreshSavings() {
  try {
    const s = await (await fetch("/lane/stats")).json();
    const t = s.total || {};
    if (!t.requests) { $("savings").textContent = ""; return; }
    const saved = t.saved || 0;
    $("savings").innerHTML = saved > 0
      ? `spent ${money(t.cost)} · <b>saved ${money(saved)}</b>
         (${Math.round(t.saved_pct)}% less)`
      : `spent ${money(t.cost)} over ${t.requests} request${t.requests === 1 ? "" : "s"}`;
  } catch { /* the totals are a nicety; never let them break the chat */ }
}

// ── mode ───────────────────────────────────────────────────────────────────
function setMode(next) {
  mode = next;
  for (const b of $("modes").children)
    b.setAttribute("aria-pressed", String(b.dataset.mode === next));
}
$("modes").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setMode(b.dataset.mode);
});

$("reset").addEventListener("click", () => {
  history = [];
  thread.innerHTML = "";
  thread.appendChild($("empty") || document.createElement("div"));
  location.reload();
});

// ── rendering ──────────────────────────────────────────────────────────────
function addMessage(who, text) {
  const empty = $("empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.innerHTML = `<div class="who">${who === "you" ? "You" : "LANE"}</div>
                  <div class="bubble"></div><div class="meta"></div>`;
  el.querySelector(".bubble").textContent = text;
  thread.appendChild(el);
  scroll();
  return el;
}
const scroll = () => { $("main").scrollTop = $("main").scrollHeight; };

function renderMeta(el, { model, lane, degraded, usage, error }) {
  const meta = el.querySelector(".meta");
  if (error) { meta.innerHTML = `<span class="err">${error}</span>`; return; }
  const p = prices[model] || {};
  const bits = [];
  if (lane) bits.push(`<span class="lane-tag lane-${lane}">${laneLabels[lane] || lane}</span>`);
  bits.push(`<span>${p.display || model || "?"}</span>`);
  if (usage && p.in != null) {
    const cost = (usage.prompt_tokens * p.in + usage.completion_tokens * p.out) / 1e6;
    bits.push(`<span class="cost">${money(cost)}</span>`);
  }
  if (degraded) bits.push(`<span class="note">${degraded}</span>`);
  meta.innerHTML = bits.join("");
}

// ── sending ────────────────────────────────────────────────────────────────
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ""; input.style.height = "auto";

  addMessage("you", text);
  history.push({ role: "user", content: text });

  const el = addMessage("lane", "");
  const bubble = el.querySelector(".bubble");
  bubble.classList.add("dots");

  let acc = "", usage = null;
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model: "lane-" + mode, messages: history,
                             stream: true })
    });
    const info = {
      model: res.headers.get("x-lane-model"),
      lane: res.headers.get("x-lane-lane"),
      degraded: res.headers.get("x-lane-degraded"),
    };

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error((body.error && body.error.message) || `HTTP ${res.status}`);
    }

    // Parse the SSE stream by hand. Frames can be split across chunks, so the
    // tail of each read is carried forward rather than parsed and dropped.
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        const line = frame.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let data; try { data = JSON.parse(payload); } catch { continue; }
        if (data.error) throw new Error(data.error.message);
        if (data.usage) usage = data.usage;
        const delta = data.choices && data.choices[0] && data.choices[0].delta;
        if (delta && delta.content) {
          acc += delta.content;
          bubble.classList.remove("dots");
          bubble.textContent = acc;
          scroll();
        }
      }
    }
    bubble.classList.remove("dots");
    if (!acc) bubble.textContent = "(no content returned)";
    history.push({ role: "assistant", content: acc });
    renderMeta(el, { ...info, usage });
    refreshSavings();
  } catch (err) {
    bubble.classList.remove("dots");
    if (!acc) bubble.textContent = "";
    renderMeta(el, { error: String(err.message || err) });
    // The failed turn is dropped from history: leaving a half-answer in place
    // would poison every later turn with content the model never finished.
    history.pop();
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

boot();
</script>
</body>
</html>
